<!--
  模板：渐变色
  特点：渐变线条装饰、年轻活力、适合生活方式/情感类文章
  关键词：活力、年轻、时尚
  适配：微信亮色/暗色主题均可正常显示（无背景色，通过渐变线条体现风格）
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; font-size: 16px; line-height: 1.9; word-wrap: break-word;">

  <!-- 标题区 -->
  <section style="text-align: center; padding: 30px 20px 25px; margin-bottom: 30px;">
    <section style="width: 60px; height: 3px; background: linear-gradient(90deg, #667eea, #764ba2); margin: 0 auto 20px; border-radius: 2px;"></section>
    <h1 style="font-size: 22px; font-weight: 700; color: #1a1a1a; margin: 0 0 15px; line-height: 1.5;">
      {{TITLE}}
    </h1>
    <section style="width: 60px; height: 3px; background: linear-gradient(90deg, #764ba2, #667eea); margin: 0 auto; border-radius: 2px;"></section>
  </section>

  <!-- 正文区 -->
  <section style="padding: 0 16px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 25px 16px; text-align: center; border-top: 1px solid #e0e0e0;">
    <p style="font-size: 13px; color: #bbb; margin: 0 0 12px; letter-spacing: 2px;">
      ✨ END ✨
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      喜欢这篇文章？点个<strong style="color: #764ba2;">「在看」</strong>告诉我
    </p>
  </section>

</section>
