<!--
  模板：渐变色
  特点：彩色渐变背景、年轻活力、适合生活方式/情感类文章
  关键词：活力、年轻、时尚
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; font-size: 16px; line-height: 1.9; word-wrap: break-word; background: #ffffff;">

  <!-- 标题区 -->
  <section style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 45px 24px 35px; text-align: center; border-radius: 0 0 30px 30px;">
    <h1 style="font-size: 24px; font-weight: 700; color: #ffffff; margin: 0 0 14px; line-height: 1.5; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">
      {{TITLE}}
    </h1>
    <p style="font-size: 13px; color: rgba(255,255,255,0.8); margin: 0; letter-spacing: 1px;">
      {{AUTHOR}} · {{DATE}}
    </p>
  </section>

  <!-- 正文区 -->
  <section style="padding: 30px 24px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 30px 24px; text-align: center; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 30px 30px 0 0;">
    <p style="font-size: 13px; color: #999; margin: 0 0 12px; letter-spacing: 2px;">
      ✨ END ✨
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      喜欢这篇文章？点个<strong style="color: #764ba2;">「在看」</strong>告诉我
    </p>
  </section>

</section>
