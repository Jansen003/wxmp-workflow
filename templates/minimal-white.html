<!--
  模板：简约白
  特点：大量留白、干净利落、适合干货/教程类文章
  关键词：简约、干净、专业、易读
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #2c2c2c; font-size: 16px; line-height: 1.9; word-wrap: break-word; background: #ffffff;">

  <!-- 标题区 -->
  <section style="text-align: center; margin-bottom: 40px; padding: 40px 20px 30px;">
    <h1 style="font-size: 24px; font-weight: 700; color: #1a1a1a; margin: 0 0 16px; line-height: 1.4; letter-spacing: 0.5px;">
      {{TITLE}}
    </h1>
    <p style="font-size: 13px; color: #999; margin: 0; letter-spacing: 1px;">
      {{AUTHOR}} · {{DATE}}
    </p>
    <section style="width: 40px; height: 3px; background: #2c2c2c; margin: 20px auto 0; border-radius: 2px;"></section>
  </section>

  <!-- 正文区 -->
  <section style="padding: 0 24px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 50px; padding: 30px 24px; text-align: center; border-top: 1px solid #f0f0f0;">
    <p style="font-size: 13px; color: #bbb; margin: 0 0 12px; letter-spacing: 2px;">
      — END —
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      觉得有用？点个<strong style="color: #2c2c2c;">「在看」</strong>让更多人看到
    </p>
  </section>

</section>
