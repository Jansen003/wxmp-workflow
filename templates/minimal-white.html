<!--
  模板：简约白
  特点：大量留白、干净利落、适合干货/教程类文章
  关键词：简约、干净、专业、易读
  适配：微信亮色/暗色主题均可正常显示
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; font-size: 15px; line-height: 1.9; word-wrap: break-word; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;">

  <!-- 正文区 -->
  <section style="padding: 0 10px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 50px; padding: 25px 10px; text-align: center; border-top: 1px solid #eee;">
    <p style="font-size: 13px; color: #bbb; margin: 0 0 12px; letter-spacing: 2px;">
      — END —
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      觉得有用？点个<strong style="color: #333;">「在看」</strong>让更多人看到
    </p>
  </section>

</section>
