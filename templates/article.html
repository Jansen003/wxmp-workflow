<!--
  微信公众号文章 HTML 模板
  使用方式：将 {{CONTENT}} 替换为文章正文 HTML
  注意：所有样式必须使用内联 style，不支持外部 CSS/JS
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; font-size: 16px; line-height: 1.8; word-wrap: break-word;">

  <!-- 标题区 -->
  <section style="text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
    <h1 style="font-size: 22px; font-weight: bold; color: #1a1a1a; margin: 0 0 10px; line-height: 1.4;">
      {{TITLE}}
    </h1>
    <p style="font-size: 14px; color: #999; margin: 0;">
      {{AUTHOR}} · {{DATE}}
    </p>
  </section>

  <!-- 正文区 -->
  <section style="padding: 0 8px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; text-align: center;">
    <p style="font-size: 14px; color: #999; margin: 0 0 10px;">
      — END —
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      觉得有用？点个<strong style="color: #fa5151;">「在看」</strong>让更多人看到 👇
    </p>
  </section>

</section>
