<!--
  模板：卡片式
  特点：每段内容像卡片一样、适合清单/盘点类文章
  关键词：模块化、清晰、易扫描
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; font-size: 16px; line-height: 1.8; word-wrap: break-word; background: #f5f5f5; padding: 20px 0;">

  <!-- 标题区 -->
  <section style="background: #ffffff; margin: 0 16px 16px; padding: 30px 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center;">
    <h1 style="font-size: 22px; font-weight: 700; color: #1a1a1a; margin: 0 0 12px; line-height: 1.4;">
      {{TITLE}}
    </h1>
    <p style="font-size: 13px; color: #999; margin: 0;">
      {{AUTHOR}} · {{DATE}}
    </p>
  </section>

  <!-- 正文区 -->
  <section style="background: #ffffff; margin: 0 16px 16px; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="background: #ffffff; margin: 0 16px; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center;">
    <p style="font-size: 13px; color: #bbb; margin: 0 0 10px;">
      — END —
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      觉得有用？点个<strong style="color: #4a90d9;">「在看」</strong>让更多人看到
    </p>
  </section>

</section>
