<!--
  模板：卡片式
  特点：模块化分隔、清晰易扫描、适合清单/盘点类文章
  关键词：模块化、清晰、易扫描
  适配：微信亮色/暗色主题均可正常显示
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; font-size: 15px; line-height: 1.8; word-wrap: break-word;">

  <!-- 标题区 -->
  <section style="text-align: center; padding: 30px 16px 25px; margin-bottom: 25px; border-bottom: 1px solid #e0e0e0;">
    <h1 style="font-size: 22px; font-weight: 700; color: #1a1a1a; margin: 0 0 16px; line-height: 1.4;">
      {{TITLE}}
    </h1>
    <section style="display: inline-block; padding: 4px 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 12px; color: #999;">
      全文共 {{WORD_COUNT}} 字
    </section>
  </section>

  <!-- 正文区 -->
  <section style="padding: 0 16px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 25px 16px; text-align: center; border-top: 1px solid #e0e0e0;">
    <p style="font-size: 13px; color: #bbb; margin: 0 0 10px;">
      — END —
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      觉得有用？点个<strong style="color: #4a90d9;">「在看」</strong>让更多人看到
    </p>
  </section>

</section>
