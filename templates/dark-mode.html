<!--
  模板：暗色系
  特点：深色背景、适合科技/夜读/程序员类文章
  关键词：酷炫、科技感、护眼
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace, -apple-system, sans-serif; color: #e0e0e0; font-size: 15px; line-height: 1.9; word-wrap: break-word; background: #1a1a2e;">

  <!-- 标题区 -->
  <section style="padding: 40px 24px 30px; border-bottom: 1px solid #2a2a4a;">
    <p style="font-size: 12px; color: #6c6c8a; margin: 0 0 12px; letter-spacing: 2px;">
      {{DATE}} · {{AUTHOR}}
    </p>
    <h1 style="font-size: 22px; font-weight: 600; color: #ffffff; margin: 0; line-height: 1.5;">
      {{TITLE}}
    </h1>
    <section style="width: 100%; height: 2px; background: linear-gradient(90deg, #667eea, #764ba2); margin-top: 20px; border-radius: 1px;"></section>
  </section>

  <!-- 正文区 -->
  <section style="padding: 30px 24px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 25px 24px; text-align: center; border-top: 1px solid #2a2a4a;">
    <p style="font-size: 13px; color: #6c6c8a; margin: 0 0 10px;">
      // EOF
    </p>
    <p style="font-size: 14px; color: #8888aa; margin: 0;">
      觉得有帮助？点个<strong style="color: #667eea;">「在看」</strong>支持一下
    </p>
  </section>

</section>
