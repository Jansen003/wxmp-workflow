<!--
  模板：科技风
  特点：代码风格字体、渐变边框线条、适合科技/编程类文章
  关键词：科技感、极客、专业
  适配：微信亮色/暗色主题均可正常显示（无背景色，通过线条和字体体现风格）
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; font-size: 15px; line-height: 1.9; word-wrap: break-word;">

  <!-- 正文区 -->
  <section style="padding: 0 10px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 25px 10px; text-align: center; border-top: 1px solid #e0e0e0;">
    <p style="font-size: 12px; color: #999; margin: 0 0 10px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;">
      // EOF
    </p>
    <p style="font-size: 14px; color: #666; margin: 0;">
      觉得有帮助？点个<strong style="color: #667eea;">「在看」</strong>支持一下
    </p>
  </section>

</section>
