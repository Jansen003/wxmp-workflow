<!--
  模板：杂志风
  特点：图文混排、有设计感、适合深度长文/观点类文章
  关键词：优雅、有层次、视觉丰富
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', 'Songti SC', serif; color: #333; font-size: 16px; line-height: 2; word-wrap: break-word; background: #fafaf8;">

  <!-- 标题区 -->
  <section style="background: #1a1a1a; padding: 50px 30px 40px; text-align: center;">
    <p style="font-size: 12px; color: #888; margin: 0 0 16px; letter-spacing: 3px; text-transform: uppercase;">
      {{AUTHOR}}
    </p>
    <h1 style="font-size: 26px; font-weight: 400; color: #ffffff; margin: 0 0 16px; line-height: 1.5; letter-spacing: 1px;">
      {{TITLE}}
    </h1>
    <section style="width: 30px; height: 1px; background: #666; margin: 20px auto 0;"></section>
    <p style="font-size: 13px; color: #666; margin: 16px 0 0;">
      {{DATE}}
    </p>
  </section>

  <!-- 正文区 -->
  <section style="padding: 40px 28px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 30px 28px; text-align: center; background: #f0f0ec;">
    <p style="font-size: 13px; color: #999; margin: 0 0 12px; letter-spacing: 2px;">
      ·  ·  ·
    </p>
    <p style="font-size: 14px; color: #666; margin: 0; font-style: italic;">
      如果这篇文章对你有启发，欢迎分享给更多人
    </p>
  </section>

</section>
