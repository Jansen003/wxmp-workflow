<!--
  模板：杂志风
  特点：优雅有层次、适合深度长文/观点类文章
  关键词：优雅、有层次、视觉丰富
  适配：微信亮色/暗色主题均可正常显示
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', 'Songti SC', serif; color: #333; font-size: 15px; line-height: 2; word-wrap: break-word; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;">

  <!-- 正文区 -->
  <section style="padding: 0 10px;">
    {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 25px 10px; text-align: center; border-top: 1px solid #e0e0e0;">
    <p style="font-size: 13px; color: #999; margin: 0 0 12px; letter-spacing: 3px;">
      ·  ·  ·
    </p>
    <p style="font-size: 14px; color: #666; margin: 0; font-style: italic;">
      如果这篇文章对你有启发，欢迎分享给更多人
    </p>
  </section>

</section>
